name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Gemini API Key into .env
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_KEY" > .env
            echo "Successfully configured GEMINI_API_KEY for build"
          else
            echo "GEMINI_API_KEY not found in repository secrets, will use placeholder from .env.example"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Little-Space-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
