name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Inject Gemini API Key into .env
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_KEY" > .env
            echo "Successfully configured GEMINI_API_KEY for build"
          else
            echo "GEMINI_API_KEY not found in repository secrets, will use placeholder from .env.example"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Priyanka-Little-Space-APK
          path: '**/build/outputs/apk/**/*.apk'
